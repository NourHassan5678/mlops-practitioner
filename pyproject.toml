[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prodml"
version = "0.1.0"
description = "Taxi duration prediction model"
dependencies = [
    "scikit-learn",
    "pandas",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "skl2onnx",
    "onnxruntime"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black", "pre-commit", "httpx"]

[project.scripts]
prodml-train = "prodml.train:run_training"
